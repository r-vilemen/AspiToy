<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente do chassi creme de brinquedo -->
    <linearGradient id="faceChassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#E8DAC7" />
    </linearGradient>

    <!-- Gradiente do bumper coral retro -->
    <linearGradient id="faceCoralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2724D" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Gradiente do visor vítreo escuro -->
    <linearGradient id="faceVisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231E1A" />
      <stop offset="100%" stop-color="#120F0D" />
    </linearGradient>

    <!-- Brilho neon nos olhos e boca -->
    <filter id="faceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#34D399" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Sombra de contato inferior -->
  <ellipse cx="32" cy="61" rx="20" ry="3" fill="#1C140E" opacity="0.25" />

  <!-- Bumper Externo Coral da Cabeça -->
  <rect x="4" y="8" width="56" height="50" rx="22" fill="url(#faceCoralGrad)" />
  <rect x="5.5" y="9.5" width="53" height="47" rx="20.5" fill="#9A3412" />

  <!-- Cabeça / Chassi Creme do AspiToy -->
  <rect x="6" y="9" width="52" height="46" rx="20" fill="url(#faceChassisGrad)" />

  <!-- Brilho superior na carcaça -->
  <path d="M16 11 C24 9.5, 40 9.5, 48 11 C42 15, 22 15, 16 11 Z" fill="#FFFFFF" opacity="0.65" />

  <!-- Moldura de borracha do visor facial -->
  <rect x="9" y="14" width="46" height="36" rx="16" fill="#2E2620" />

  <!-- Tela Curva OLED do Visor (A Cara do Robô) -->
  <rect x="10.5" y="15.5" width="43" height="33" rx="14.5" fill="url(#faceVisorGrad)" stroke="#453B32" stroke-width="0.8" />

  <!-- Reflexo angular de vidro do visor -->
  <path d="M14 17 L21 17 L15 47 L12 47 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Rosto Expressivo com Brilho Neon (Olhos e Sorriso) -->
  <g filter="url(#faceGlow)">
    <!-- Olho Esquerdo (Squircle arredondado luminoso) -->
    <rect x="17.5" y="22.5" width="11" height="13.5" rx="4.5" fill="#34D399" />

    <!-- Olho Direito (Squircle arredondado luminoso) -->
    <rect x="35.5" y="22.5" width="11" height="13.5" rx="4.5" fill="#34D399" />

    <!-- Boca em Arco Sorridente (LED verde alegre) -->
    <path d="M26.5 40.5 Q32 45 37.5 40.5" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Pupilas / Brilho Especular Vivo nos Olhos -->
  <circle cx="24.5" cy="25.5" r="1.8" fill="#FFFFFF" />
  <circle cx="42.5" cy="25.5" r="1.8" fill="#FFFFFF" />

  <!-- Antena no Topo da Cabeça -->
  <rect x="30.5" y="2.5" width="3" height="6.5" rx="1.5" fill="#78350F" />

  <!-- Estrela Dourada Toy Story no Topo -->
  <path d="M32 0.5 L33.6 4.2 L37.5 4.6 L34.6 7.2 L35.5 11 L32 9.1 L28.5 11 L29.4 7.2 L26.5 4.6 L30.4 4.2 Z" fill="#FBBF24" stroke="#B45309" stroke-width="0.8" />
  <circle cx="31.4" cy="4.2" r="1" fill="#FEF08A" />
</svg>
